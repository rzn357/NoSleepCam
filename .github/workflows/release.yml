name: Release

# Pushing a tag like v1.2.3 builds the signed APK and creates a DRAFT GitHub release for it.
# Review the draft on GitHub and press "Publish release" yourself. See "Releasing" in README.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and draft the release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Skip if the release already exists
        id: existing
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists - nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the tag against versionName and the changelog
        if: steps.existing.outputs.exists == 'false'
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Restore the release key
        if: steps.existing.outputs.exists == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (Settings > Secrets and variables > Actions)"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # The Gradle daemon toolchain (gradle/gradle-daemon-jvm.properties) asks for JDK 25.
      - uses: actions/setup-java@v6
        if: steps.existing.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        if: steps.existing.outputs.exists == 'false'

      - name: Checks
        if: steps.existing.outputs.exists == 'false'
        run: ./gradlew spotlessCheck detekt lintDebug testDebugUnitTest

      - name: Build the signed release
        if: steps.existing.outputs.exists == 'false'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew collectRelease \
            -Pnosleepcam.signing.storeFile="$RELEASE_KEYSTORE" \
            -Pnosleepcam.signing.storePassword="$KEYSTORE_PASSWORD" \
            -Pnosleepcam.signing.keyAlias="$KEY_ALIAS" \
            -Pnosleepcam.signing.keyPassword="$KEY_PASSWORD"

      - name: Verify the signature
        if: steps.existing.outputs.exists == 'false'
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "dist/NoSleepCam-$VERSION.apk" | tee "$RUNNER_TEMP/certs.txt"
          if grep -q "Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::The APK is signed with the debug key"
            exit 1
          fi

      - name: Write the release notes
        if: steps.existing.outputs.exists == 'false'
        run: |
          apk_sha=$(cut -d' ' -f1 "dist/NoSleepCam-$VERSION.apk.sha256")
          cert_sha=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt")
          {
            # The changelog section of this version, without its heading.
            awk -v h="## [$VERSION]" '
              substr($0, 1, length(h)) == h { found = 1; next }
              found && substr($0, 1, 4) == "## [" { exit }
              found { print }
            ' CHANGELOG.md
            echo
            echo "## Install"
            echo "Download \`NoSleepCam-$VERSION.apk\` below and open it on the phone (allow installs from this source if asked)."
            echo "Android 7.0 (API 24) or newer. Grant the camera permission on the first start."
            echo
            echo "## Verify"
            echo "APK SHA-256:"
            echo '```'
            echo "$apk_sha"
            echo '```'
            echo "Signing certificate SHA-256 (\`apksigner verify --print-certs\`):"
            echo '```'
            echo "$cert_sha"
            echo '```'
            echo
            echo "\`NoSleepCam-$VERSION-mapping.txt\` is the R8 mapping, only needed to decode stack traces."
          } > "$RUNNER_TEMP/notes.md"

      - name: Create the draft release
        if: steps.existing.outputs.exists == 'false'
        run: |
          gh release create "$TAG" \
            "dist/NoSleepCam-$VERSION.apk" \
            "dist/NoSleepCam-$VERSION.apk.sha256" \
            "dist/NoSleepCam-$VERSION-mapping.txt" \
            --draft --verify-tag \
            --title "NoSleepCam $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
