# Only the differences from detekt's default configuration (buildUponDefaultConfig = true).
# Run: ./gradlew detekt

style:
  MagicNumber:
    # This is a UI/Camera2 code base full of dp sizes and angles; named constants are used where they carry meaning.
    active: false
  ReturnCount:
    active: false
  ThrowsCount:
    active: false
  MaxLineLength:
    maxLineLength: 140
    excludeCommentStatements: true
  UnusedPrivateProperty:
    active: true

complexity:
  ComplexCondition:
    allowedConditions: 4
  TooManyFunctions:
    # Android views (drawing + gestures) are naturally method-heavy; 11 (the default) is too tight for them.
    allowedFunctionsPerClass: 25
    allowedFunctionsPerFile: 25
    # The limit is about a class's public surface. A state machine such as CameraController has many small private
    # handlers for Camera2 callbacks; counting them would only push those into needless indirection.
    ignorePrivate: true

naming:
  FunctionNaming:
    active: true

exceptions:
  TooGenericExceptionCaught:
    # Camera2 and MediaStore throw many unrelated runtime exceptions; the failure paths log and recover on purpose.
    active: false
  SwallowedException:
    active: false
